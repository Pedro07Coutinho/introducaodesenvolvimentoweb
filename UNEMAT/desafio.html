<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>titulo</title>
</head>
<body>
    <form action="https://ivanpires.dev/processa.php" method="post">
        <fieldset>
            <legend>Formulário de Contato</legend>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome">
            <br>
            <label for="telefone">Telefone:</label>
            <input type="text" name="telefone" id="telefone">
            <br>
        </fieldset>

        <fieldset>
            <legend>fds:</legend>
            <select name="informacoes" id="informacoes">
                <option value="opcao1">Opção 1</option>
                <option value="opcao2">Opção 2</option>
                <option value="opcao3">Opção 3</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>5 maiores cidades do Mato Grosso</legend>
            <select name="cidade" id="cidade">
                <option value="cuiaba">Cuiabá</option>
                <option value="varzea-grande">Várzea Grande</option>
                <option value="rondonopolis">Rondonópolis</option>
                <option value="sinop">Sinop</option>
                <option value="lucas-do-rio-verde">Lucas do Rio Verde</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Mensagem:</legend>
            <datalist id="mensagem">
                <option value="macaco"></option>
                <option value="banana"></option>
                <option value="africano"></option>
            </datalist>
            <input type="text" name="mensagem" id="sla" list="mensagem">
        </fieldset>
        <input type="submit" value="Enviar">
        
    </form>
</body>
</html>
